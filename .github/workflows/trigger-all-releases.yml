name: Trigger all app releases

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Shipping Email release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}
        run: gh workflow run release.yml --repo Kha0s90/shipping_email --ref main

      - name: Trigger OpenLens release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}
        run: gh workflow run release.yml --repo Kha0s90/OpenLens --ref main

      - name: Trigger Fusion Updater releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}
        run: gh workflow run publish-releases.yml --repo Kha0s90/fusion_updater --ref main

      - name: Trigger Windows App Manager release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TRIGGER_TOKEN }}
        run: gh workflow run release.yml --repo Kha0s90/app_updater --ref main

      - name: Summary
        run: |
          echo "All four release workflows were dispatched."
          echo "Check each source repository's Actions page for the individual runs."
